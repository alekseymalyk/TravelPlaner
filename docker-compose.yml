services:
  web:
    build: .
    command: >
      sh -c "uv run --no-dev python manage.py migrate &&
             uv run --no-dev python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      - ARTIC_API_BASE_URL=https://api.artic.edu/api/v1
      - ARTIC_API_TIMEOUT=10
    volumes:
      - .:/app
